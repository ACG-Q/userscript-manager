name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read
  # 详情页评论区按版本帖切换：构建时要读 GitHub Discussions 才能拉到各版本评论
  discussions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 命令面板 (#1) 的动态不进入站点数据；命令流程提交后已通过
    # gh workflow run 显式派发部署，这里跳过以避免无意义的重建。
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.issue.number != 1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build_pages.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage site structure
        run: |
          mkdir _site
          mv dist/* _site/
          mkdir _site/dist
          find _site -maxdepth 1 -name '*.user.js' -exec mv -t _site/dist {} +

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
