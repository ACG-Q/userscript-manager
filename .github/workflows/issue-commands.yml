name: Issue Commands Manager

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write
  discussions: write

concurrency:
  group: issue-commands
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 仅 Issue #1 (命令面板) 触发执行
    if: ${{ !github.event.issue.pull_request && github.event.issue.number == 1 }}
    steps:
      # 权限门禁：比较评论者是否仓库拥有者
      - name: Permission gate
        id: gate
        env:
          COMMENT_USER: ${{ github.event.comment.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$COMMENT_USER" == "$REPO_OWNER" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      # 非拥有者的命令评论 -> 自动删除
      - name: Delete unauthorized comment
        if: steps.gate.outputs.authorized == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}
          echo "已删除未授权用户的命令评论"

      # 以下步骤仅授权用户执行
      - name: Checkout
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.authorized == 'true'
        run: |
          pip install -r requirements.txt

      - name: Run manager
        id: manager
        if: steps.gate.outputs.authorized == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_PAGES_URL: ${{ vars.GITHUB_PAGES_URL }}
          AUTHOR_NAME: ${{ vars.AUTHOR_NAME }}
          AUTHOR_NAMESPACE: ${{ vars.AUTHOR_NAMESPACE }}
        run: |
          python manager.py

      # 单向投影：registry -> Issues（失败不阻断，警告并入回帖）
      - name: Project issues
        if: steps.gate.outputs.authorized == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if PROJ_OUT=$(python project_issues.py 2>&1); then
            echo "$PROJ_OUT"
          else
            printf '\n⚠️ Issue 投影失败（真源已保存，下次执行命令时自动重试对账）\n%s\n' "$PROJ_OUT" >> command_result.txt
          fi

      - name: Commit changes
        id: commit
        if: steps.gate.outputs.authorized == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply command: ${{ github.event.comment.user.login }}"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 的 push 不触发任何 workflow（GitHub 官方规则），
      # 显式派发部署，保证回帖中的安装链接指向包含本次命令的最新构建。
      - name: Trigger site deploy
        if: steps.gate.outputs.authorized == 'true' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh workflow run deploy-pages.yml -R ${{ github.repository }}; then
            echo "⚠️ 站点部署派发失败（不阻断），安装链接可能滞后，可手动触发 Deploy 工作流" >> command_result.txt
          fi

      # 即使前面步骤失败也必须回帖，否则提问者只会得到一条永远没有结果的评论
      - name: Reply to comment
        if: ${{ !cancelled() && steps.gate.outputs.authorized == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MANAGER_OUTCOME: ${{ steps.manager.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          if [ -f command_result.txt ]; then
            RESULT=$(cat command_result.txt)
          else
            RESULT=""
          fi
          if [ "$MANAGER_OUTCOME" != "success" ]; then
            FAIL_MSG="⚠️ 命令执行失败（Run manager: $MANAGER_OUTCOME），请打开本次运行日志查看。"
            if [ -n "$RESULT" ]; then
              RESULT="$FAIL_MSG"$'\n\n'"$RESULT"
            else
              RESULT="$FAIL_MSG"
            fi
          elif [ "$COMMIT_OUTCOME" != "success" ] && [ "$COMMIT_OUTCOME" != "skipped" ]; then
            if [ -z "$RESULT" ]; then RESULT="操作完成"; fi
            RESULT="$RESULT"$'\n'"⚠️ 提交/推送失败（Commit changes: $COMMIT_OUTCOME），改动未入库，请打开本次运行日志查看。"
          elif [ -z "$RESULT" ]; then
            RESULT="操作完成"
          fi
          gh issue comment $ISSUE_NUMBER -R ${{ github.repository }} --body "**执行结果：**"$'\n'"$RESULT"
